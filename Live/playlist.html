<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Setlist</title>
<script src="main.js"></script>
<style>
:root{
  --bg:#0e0f11; --panel:#17191c; --line:#2a2d32; --text:#f2f2f2; --dim:#9aa0a6;
  --accent:#2d5cff; --go:#1fa74d; --stop:#c0392b; --warn:#e6a700;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#app{display:flex;flex-direction:column;height:100%}

/* faixa de status (conexão / serviço / erro) */
#status{display:none;padding:10px 16px;font-weight:700;font-size:15px;text-align:center}
#status.show{display:block}
#status.err{background:var(--stop)}
#status.warn{background:var(--warn);color:#000}

/* cabeçalho: música atual */
header{background:var(--panel);padding:14px 20px 16px;border-bottom:1px solid var(--line)}
.label{font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
#current{font-size:clamp(26px,5vw,44px);font-weight:800;line-height:1.15;margin:4px 0 10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{height:8px;background:#2a2d32;border-radius:4px;overflow:hidden}
#barFill{height:100%;width:0;background:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:10px;flex-wrap:wrap}
#remain{font-size:clamp(30px,6vw,52px);font-weight:800;font-variant-numeric:tabular-nums}
#remain small{font-size:14px;font-weight:400;color:var(--dim);margin-left:6px}
.side{text-align:right;color:var(--dim);font-size:15px;font-variant-numeric:tabular-nums;line-height:1.5}
.side b{color:var(--text)}
#next{font-size:19px;color:var(--dim);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#next b{color:var(--text)}

/* controles */
nav{display:grid;grid-template-columns:1fr 2fr 1fr 2fr;gap:10px;padding:12px;background:#1d2024;border-bottom:1px solid var(--line)}
nav button{border:none;border-radius:10px;color:#fff;font-size:20px;font-weight:700;padding:16px 8px;
  background:#3a3e44;cursor:pointer;position:relative;overflow:hidden;touch-action:manipulation}
nav button:active{filter:brightness(1.25)}
button small{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:2px}
button span{position:relative}
.go{background:var(--go)}
.stop{background:var(--stop)}
.hold .fill{position:absolute;inset:0;background:rgba(255,255,255,.35);transform:scaleX(0);transform-origin:left}
.hold.holding .fill{transform:scaleX(1);transition:transform var(--hold,600ms) linear}
@media (max-width:640px){
  nav{grid-template-columns:1fr 1fr}
  #btnPrev{order:3} #btnNext{order:4}
}

/* lista */
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.song{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid #1f2226;border-left:6px solid transparent}
.num{min-width:2ch;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.name{flex:1;font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loops{font-size:13px;color:var(--dim);border:1px solid #3a3e44;border-radius:4px;padding:1px 6px}
.time{color:var(--dim);font-size:18px;font-variant-numeric:tabular-nums}
.song.done{opacity:.4}
.song.next{background:#1f242c}
.song.active{background:var(--accent)}
.song.active .num,.song.active .time,.song.active .loops{color:#fff;border-color:#fff8}
#empty{padding:40px 20px;text-align:center;color:var(--dim);font-size:18px}
.song{cursor:pointer}
.song.picked{outline:3px solid var(--go);outline-offset:-3px}
nav button:disabled{opacity:.35}

/* confirmação "tocar a partir daqui" */
#sheet{position:fixed;left:0;right:0;bottom:0;background:#202328;border-top:2px solid var(--go);
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .18s ease-out;z-index:5}
#sheet.open{transform:none}
#sheetTitle{font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
#sheetName{font-size:24px;font-weight:800;margin:4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheetWarn{font-size:14px;color:var(--warn);margin-bottom:8px;display:none}
#sheetWarn.show{display:block}
.sheetBtns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:8px}
.sheetBtns button{border:none;border-radius:10px;color:#fff;font-size:19px;font-weight:700;padding:18px 8px;position:relative;overflow:hidden;touch-action:manipulation}
.sheetBtns .cancel{background:#3a3e44}

/* rodapé */
footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;
  background:var(--panel);border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
footer .dirty{color:var(--warn);flex-shrink:0;font-weight:700}
footer #meta{flex:1}
#meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== TELAS DEITADAS (tablet/celular): duas colunas, controles à esquerda e lista à direita ===== */
@media (orientation:landscape) and (min-width:700px){
  #app{display:grid;grid-template-columns:minmax(330px,42%) 1fr;grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"status status" "left list" "foot foot"}
  #status{grid-area:status}
  #left{grid-area:left;display:flex;flex-direction:column;min-height:0;overflow-y:auto;border-right:1px solid var(--line)}
  header{flex:1;display:flex;flex-direction:column;justify-content:center;border-bottom:none}
  nav{grid-template-columns:1fr 1fr;border-bottom:none}
  #btnPlay{order:1} #btnStop{order:2} #btnPrev{order:3} #btnNext{order:4}
  #list{grid-area:list;min-height:0}
  footer{grid-area:foot}
  #sheet{left:auto;right:0;width:min(560px,58%);border-left:2px solid var(--go);border-radius:12px 0 0 0}
}
/* celular deitado: pouca altura, tudo mais compacto */
@media (orientation:landscape) and (max-height:520px){
  header{padding:8px 14px}
  .label{font-size:11px}
  #current{font-size:22px;margin:2px 0 6px}
  #remain{font-size:30px}
  .row{margin-top:6px}
  .side{font-size:13px;line-height:1.35}
  #next{font-size:15px;margin-top:6px}
  nav{gap:6px;padding:6px 8px}
  nav button{padding:9px 6px;font-size:16px}
  nav button small{font-size:10px}
  .song{padding:10px 14px;gap:10px}
  .name{font-size:17px}
  .time{font-size:15px}
  footer{padding:4px 10px}
  footer button{padding:6px 10px}
  #sheet{padding:10px 12px}
  #sheetName{font-size:19px}
  .sheetBtns button{padding:12px 6px;font-size:16px}
}
/* celular em pé pequeno */
@media (orientation:portrait) and (max-height:700px){
  header{padding:10px 16px 12px}
  #current{margin:2px 0 8px}
  #remain{font-size:34px}
  #next{margin-top:6px;font-size:17px}
  nav{gap:8px;padding:8px}
  nav button{padding:12px 6px}
  .song{padding:12px 16px}
  .name{font-size:19px}
}
footer button{background:#2a2d32;border:none;color:#fff;border-radius:6px;padding:9px 12px;font-size:14px;white-space:nowrap}
</style>
</head>
<body>
<div id="app">

  <div id="status"></div>

  <div id="left">
  <header>
    <div class="label" id="stateLabel">Parado</div>
    <div id="current">—</div>
    <div id="bar"><div id="barFill"></div></div>
    <div class="row">
      <div id="remain">--:--<small>restante</small></div>
      <div class="side">
        Posição <b id="pos">--</b><br>
        Fim do show em <b id="showLeft">--:--</b>
      </div>
    </div>
    <div id="next">Próxima: <b>—</b></div>
  </header>

  <nav>
    <button id="btnPrev">⏮<small>anterior</small></button>
    <button id="btnPlay" class="go hold"><div class="fill"></div><span>▶ INICIAR<small id="playHint">toque</small></span></button>
    <button id="btnNext">⏭<small>próxima</small></button>
    <button id="btnStop" class="stop hold"><div class="fill"></div><span>⏹ PARAR<small>segure</small></span></button>
  </nav>
  </div>

  <div id="list"><div id="empty">Aguardando o REAPER…</div></div>

  <div id="sheet">
    <div id="sheetTitle">Tocar a partir de</div>
    <div id="sheetName">—</div>
    <div id="sheetWarn">Projeto com alterações não salvas: a ordem pode não bater com a do SWS. Salve antes.</div>
    <div class="sheetBtns">
      <button id="sheetCancel" class="cancel">Cancelar</button>
      <button id="sheetGo" class="go hold"><div class="fill"></div><span>▶ TOCAR DAQUI<small>segure</small></span></button>
    </div>
  </div>

  <footer>
    <div id="meta">—</div>
    <div id="dirty" class="dirty" hidden>⚠ não salvo</div>
    <button id="btnRefresh">🔄 Atualizar</button>
  </footer>

</div>

<script>
// Tudo dentro de uma função para não colidir com as variáveis globais do main.js do REAPER.
(() => {
/* ====== CONFIG ====== */
const SECTION = "SWSWebControl";           // mesmo nome usado no script Lua
const HOLD_MS = 600;                        // tempo segurando para PARAR / reiniciar
const ACTIONS = {                           // IDs do SWS: iguais em qualquer instalação
  play: "_S&M_PLAY_RGN_PLAYLIST",
  next: "_S&M_PLAY_NEXT_RGN_PLAYLIST",
  prev: "_S&M_PLAY_PREV_RGN_PLAYLIST",
  stop: "1016"
};

/* ====== ESTADO ====== */
let data = null, items = [], rawPlaylist = null, cur = -1;
let playState = 0, pos = 0, posStr = "--";
let lastTransportAt = 0, lastBeat = null, lastBeatAt = 0;
let pending = null;          // { idx, until }: item que acabamos de mandar tocar (resolve músicas repetidas)
let lastJump = null, picked = -1;
const startedAt = Date.now();
const $ = id => document.getElementById(id);

/* ====== UTIL ====== */
function fmt(s){
  if(!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? h + ":" + p(m) + ":" + p(ss) : p(m) + ":" + p(ss);
}
function dec(s){ try { return decodeURIComponent(s); } catch(e){ return s; } }
// a interface web escapa \t, \n e \\ nos valores de ExtState
function unesc(v){ return String(v).replace(/\\(.)/g, (m, c) => c === "t" ? "\t" : c === "n" ? "\n" : c); }

/* ====== PLAYLIST ====== */
function onPlaylist(raw){
  if(raw === rawPlaylist) return;
  rawPlaylist = raw;
  if(!raw){ data = null; items = []; render(); return; }
  try { data = JSON.parse(raw); }
  catch(e){ data = { ok:false, error:"Resposta inválida do REAPER." }; }
  items = data.ok ? data.items.map(it => ({ ...it, name: dec(it.name) })) : [];
  cur = -1;
  render();
  tick();
}

function render(){
  const list = $("list");
  list.textContent = "";
  if(!items.length){
    const d = document.createElement("div");
    d.id = "empty";
    d.textContent = data && !data.ok ? dec(data.error) : (data ? "Playlist vazia." : "Aguardando o REAPER…");
    list.appendChild(d);
  }
  items.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "song";
    row.id = "song_" + i;
    if(s.color) row.style.borderLeftColor = s.color;

    const n = document.createElement("div"); n.className = "num"; n.textContent = i + 1;
    const nm = document.createElement("div"); nm.className = "name"; nm.textContent = s.name;
    row.append(n, nm);
    if(s.infinite || s.loops > 1){
      const l = document.createElement("div"); l.className = "loops";
      l.textContent = s.infinite ? "∞" : "×" + s.loops;
      row.appendChild(l);
    }
    const t = document.createElement("div"); t.className = "time"; t.textContent = fmt(s.duration);
    row.appendChild(t);
    row.addEventListener("click", () => openSheet(i));
    list.appendChild(row);
  });

  // rodapé
  const meta = $("meta");
  meta.textContent = "";
  if(data){
    const parts = [];
    if(data.ok){
      parts.push(dec(data.playlist) + (data.playlists > 1 ? " (de " + data.playlists + ")" : ""));
      parts.push(items.length + " músicas · " + fmt(data.total));
      if(data.missing && data.missing.length) parts.push(data.missing.length + " região(ões) não encontrada(s)");
    }
    parts.push("lido às " + data.readAt);
    meta.append(parts.join(" · "));
    meta.title = parts.join(" · ");
  }
  $("dirty").hidden = !(data && data.dirty);
}

/* acha o item tocando; começa pelo atual e pelo seguinte, para regiões repetidas na setlist */
function findIndex(p){
  const inside = i => i >= 0 && i < items.length && p >= items[i].start && p < items[i].end;
  if(pending){
    if(Date.now() > pending.until) pending = null;
    else if(inside(pending.idx)){ const i = pending.idx; pending = null; return i; }
    else return cur;   // ainda não chegou lá: não pisca outra música no meio do salto
  }
  if(inside(cur)) return cur;
  if(inside(cur + 1)) return cur + 1;      // andamento normal da setlist
  for(let i = 0; i < items.length; i++) if(inside(i)) return i;   // salto: 1ª ocorrência
  return -1;
}

function tick(){
  $("pos").textContent = posStr;
  const idx = findIndex(pos);

  if(idx !== cur){
    cur = idx;
    document.querySelectorAll(".song").forEach((e, i) => {
      e.classList.toggle("active", i === cur);
      e.classList.toggle("next", cur >= 0 && i === cur + 1);
      e.classList.toggle("done", cur >= 0 && i < cur);
    });
    const a = $("song_" + cur);
    if(a) a.scrollIntoView({ behavior:"smooth", block:"center" });
    $("current").textContent = cur >= 0 ? items[cur].name : "—";
    const nb = $("next").querySelector("b");
    const nx = cur >= 0 ? items[cur + 1] : items[0];
    nb.textContent = nx ? nx.name : "fim da setlist";
  }

  if(cur >= 0){
    const s = items[cur], len = s.end - s.start;
    const left = s.end - pos;
    $("remain").firstChild.nodeValue = fmt(left);
    $("barFill").style.width = Math.min(100, Math.max(0, (pos - s.start) / len * 100)) + "%";
    let rest = left;
    for(let i = cur + 1; i < items.length; i++) rest += items[i].duration;
    $("showLeft").textContent = fmt(rest);
  } else {
    $("remain").firstChild.nodeValue = "--:--";
    $("barFill").style.width = "0";
    $("showLeft").textContent = data && data.ok ? fmt(data.total) : "--:--";
  }

  const playing = isPlaying();
  $("stateLabel").textContent = playing ? "Tocando agora" : (playState === 2 || playState === 6) ? "Pausado em" : "Parado em";
  $("playHint").textContent = playing ? "segure p/ reiniciar" : "toque";
  $("btnNext").disabled = !playing;
  $("btnPrev").disabled = !playing;
}

/* ====== RESPOSTAS DO REAPER ====== */
function wwr_onreply(results){
  for(const line of results.split("\n")){
    if(!line) continue;
    const t = line.split("\t");
    if(t[0] === "TRANSPORT"){
      playState = parseInt(t[1], 10);
      pos = parseFloat(t[2]);
      posStr = t[4] || fmt(pos);
      lastTransportAt = Date.now();
      tick();
    } else if(t[0] === "EXTSTATE" && t[1] === SECTION){
      const v = unesc(t.slice(3).join("\t"));
      if(t[2] === "playlist") onPlaylist(v);
      else if(t[2] === "beat" && v !== lastBeat){ lastBeat = v; lastBeatAt = Date.now(); }
      else if(t[2] === "jump" && v !== lastJump){
        // salto feito por qualquer tablet/celular conectado
        if(lastJump !== null){
          const idx = parseInt(v.split(":")[1], 10);
          if(idx >= 0 && idx < items.length) pending = { idx, until: Date.now() + 4000 };
        }
        lastJump = v;
      }
    }
  }
}

/* ====== AVISOS ====== */
function setStatus(kind, text){
  const s = $("status");
  s.className = kind ? "show " + kind : "";
  s.textContent = text || "";
}
setInterval(() => {
  const now = Date.now();
  const grace = now - startedAt < 3000;
  if(now - lastTransportAt > 2000)
    setStatus(grace ? "" : "err", "SEM CONEXÃO COM O REAPER");
  else if(!lastBeat || now - lastBeatAt > 4000)
    setStatus(grace ? "" : "warn", "Serviço não está rodando no REAPER — execute “SWS Web Control.lua”");
  else if(data && !data.ok)
    setStatus("warn", dec(data.error));
  else
    setStatus("");
}, 500);

/* ====== COMANDOS ====== */
const isPlaying = () => playState === 1 || playState === 5;
const serviceAlive = () => lastBeat !== null && Date.now() - lastBeatAt < 4000;
function sendCmd(c){ wwr_req("SET/EXTSTATE/" + SECTION + "/cmd/" + c); }

function skip(dir){
  if(!isPlaying()) return;
  if(cur >= 0){
    const idx = cur + dir;
    if(idx >= 0 && idx < items.length) pending = { idx, until: Date.now() + 4000 };
  }
  if(serviceAlive()) sendCmd(dir > 0 ? "next" : "prev");      // pula na hora (ver SKIP_IMMEDIATE no Lua)
  else wwr_req(dir > 0 ? ACTIONS.next : ACTIONS.prev);        // reserva: ação direta do SWS
}

function openSheet(i){
  if(!items[i]) return;
  picked = i;
  document.querySelectorAll(".song").forEach((e, k) => e.classList.toggle("picked", k === i));
  $("sheetName").textContent = (i + 1) + ". " + items[i].name;
  $("sheetWarn").classList.toggle("show", !!(data && data.dirty));
  $("sheet").classList.add("open");
}
function closeSheet(){
  picked = -1;
  document.querySelectorAll(".song.picked").forEach(e => e.classList.remove("picked"));
  $("sheet").classList.remove("open");
}
function playFromPicked(){
  const i = picked;
  closeSheet();
  if(i < 0) return;
  if(!serviceAlive()){ setStatus("err", "Serviço do REAPER não está rodando: não dá para tocar a partir de uma música."); return; }
  pending = { idx: i, until: Date.now() + 4000 };
  sendCmd("playfrom:" + i);
}

/* ====== BOTÕES ====== */
function holdButton(el, msFn, fn){
  let timer = null;
  const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } el.classList.remove("holding"); };
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    const ms = msFn();
    if(ms <= 0){ fn(); return; }
    el.style.setProperty("--hold", ms + "ms");
    el.classList.add("holding");
    timer = setTimeout(() => { timer = null; el.classList.remove("holding"); fn(); }, ms);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => el.addEventListener(ev, cancel));
}
function tap(el, fn){
  el.addEventListener("pointerdown", e => { e.preventDefault(); fn(); });
}

holdButton($("btnStop"), () => HOLD_MS, () => wwr_req(ACTIONS.stop));
// INICIAR: toque simples parado; se já está tocando, precisa segurar (evita voltar pra 1ª música sem querer)
holdButton($("btnPlay"), () => (playState === 1 || playState === 5) ? HOLD_MS : 0, () => {
  if(items.length) pending = { idx: 0, until: Date.now() + 4000 };   // o SWS sempre começa do 1º item
  wwr_req(ACTIONS.play);
});
tap($("btnNext"), () => skip(1));
tap($("btnPrev"), () => skip(-1));
holdButton($("sheetGo"), () => HOLD_MS, playFromPicked);
tap($("sheetCancel"), closeSheet);
tap($("btnRefresh"), () => {
  wwr_req("SET/EXTSTATE/" + SECTION + "/cmd/refresh");
  setTimeout(() => wwr_req("GET/EXTSTATE/" + SECTION + "/playlist"), 400);
});
document.addEventListener("contextmenu", e => e.preventDefault());

/* ====== INÍCIO ====== */
window.onload = () => {
  wwr_req_recur("TRANSPORT", 100);
  wwr_req_recur("GET/EXTSTATE/" + SECTION + "/playlist", 500);
  wwr_req_recur("GET/EXTSTATE/" + SECTION + "/beat", 1000);
  wwr_req_recur("GET/EXTSTATE/" + SECTION + "/jump", 300);
  wwr_start();
};

// o main.js do REAPER chama esta função global com as respostas
window.wwr_onreply = wwr_onreply;
})();
</script>
</body>
</html>
